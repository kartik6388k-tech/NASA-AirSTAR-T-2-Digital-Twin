# =============================================================================
# NASA AirSTAR T-2 / 5.5% Generic Transport Model
# Propulsion configuration (frozen propulsion section)
# Configuration identity:
#   Aircraft: NASA AirSTAR T-2 (GTM, 5.5% dynamically scaled)
#   Engines:  x2 JetCat P70 turbines
#   Sources:  NASA AirSTAR briefings, GTM flight-test/system-ID papers, and AIAA 2015-2704
# =============================================================================

configuration_identity:
  aircraft: "NASA AirSTAR T-2"
  program: "AirSTAR (Airborne Subscale Transport Aircraft Research)"
  scale: "5.5 percent dynamically scaled Generic Transport Model"
  propulsion_architecture: "twin independent turbine engines"
  engine_manufacturer: "JetCat"
  engine_model: "P70"
  engine_variant: "NOT_FOUND_DO_NOT_ASSUME"
  configuration_note: "Use only for T-2 GTM configuration; do not mix with other GTM variants or unrelated turbofan datasets."


# -----------------------------------------------------------------------------
# AIRCRAFT — ACTIVE PHYSICAL CONFIGURATION
# This is the ONLY authoritative model-facing location for the active Aircraft
# geometry and mass/inertia values consumed by models/aircraft.py.
#
# Active physical baseline:
#   NASA/TM-2017-219795, Table 1 ("T-2 and GTM geometry and nominal mass properties")
#
# Flight 41 / Flight 15 mass and Iyy values below remain case-specific reference
# data and MUST NOT overwrite this active aircraft baseline.
# -----------------------------------------------------------------------------
aircraft:
  active_baseline_id: "NASA_T2_NOMINAL_2017"

  identification:
    name: "NASA AirSTAR T-2"
    configuration: "T-2 5.5% dynamically scaled Generic Transport Model"
    scale: 0.055
    aircraft_type: "GTM (Generic Transport Model)"

  geometry:
    # Model-facing SI values derived once from NASA/TM-2017-219795 Table 1.
    wing_span_m: 2.08788
    wing_area_m2: 0.548127936
    mac_m: 0.280416

  mass_properties:
    # Model-facing SI values derived once from NASA/TM-2017-219795 Table 1.
    mass_kg: 23.934000817018433
    Ixx_kgm2: 1.5998651790310523
    Iyy_kgm2: 6.304553459741012
    Izz_kgm2: 7.565464151689214
    Ixz_kgm2: 0.2847217691495941

    # Ixy/Iyz are not supplied by the cited Table 1 and are intentionally absent.
    # CG is intentionally absent until the NASA model-frame/body-frame reference
    # convention is locked for this project.

  source_provenance:
    document: "Position Corrections for Airspeed and Flow Angle Measurements on Fixed-Wing Aircraft"
    author: "Jared A. Grauer"
    year: 2017
    report: "NASA/TM-2017-219795"
    nasa_document_id: "20180000023"
    table: "Table 1 - T-2 and GTM geometry and nominal mass properties"
    source_values_nasa:
      wing_span_ft: 6.85
      mean_aerodynamic_chord_ft: 0.92
      wing_reference_area_ft2: 5.90
      mass_slug: 1.64
      Ixx_slug_ft2: 1.18
      Iyy_slug_ft2: 4.65
      Izz_slug_ft2: 5.58
      Ixz_slug_ft2: 0.21
      cg_model_frame_in:
        x_cm: 56.4
        y_cm: 0.00
        z_cm: 11.5
    cg_activation_status: "NOT_ACTIVE_REFERENCE_FRAME_CONVENTION_NOT_LOCKED"
    inertia_product_status: "SOURCE_REPORTED_IXZ_SIGN_PRESERVED; 6DOF_MATRIX_SIGN_CONVENTION_MUST_BE_LOCKED_BEFORE_USE"
    note: "NASA states the tabulated positions are in the model frame, not the body frame. CG values are retained only in provenance and are not loaded into Aircraft.mass_properties."

# -----------------------------------------------------------------------------
# ACTIVE MODEL SELECTION
# Separate the physical aircraft baseline from a flight-specific aerodynamic
# linearization case. The case mass/Iyy remain reference properties only.
# -----------------------------------------------------------------------------
active_model_selection:
  physical_aircraft_baseline_id: "NASA_T2_NOMINAL_2017"
  aerodynamic_linearization_case: "T-2 Flight 41"
  aerodynamic_condition_key: "flight_41"
  use_flight_case_mass_as_aircraft_mass: false
  initial_aircraft_state_status: "NOT_SET"
  note: "Flight 41 is the currently selected local longitudinal perturbation model. No complete NED/body trim state is invented here; aircraft.initial_conditions remains absent until a trim/state definition is explicitly established."
  dynamic_pressure_semantics: "ISA_BASED_NOMINAL_NOT_MEASURED_FLIGHT_TEST_DYNAMIC_PRESSURE"

# -----------------------------------------------------------------------------
# NASA_VERIFIED_PHYSICAL_DATA
# Directly documented hardware facts, measured channels, data-acquisition facts,
# and context-only physical values. Model structures are kept in a separate
# NASA_VERIFIED_MODEL_STRUCTURE section below.
# -----------------------------------------------------------------------------
nasa_verified_physical_data:


  active_aircraft_baseline_source:
    status: "NASA_VERIFIED_REFERENCE_DATA"
    active_config_path: "aircraft"
    source:
      document: "Position Corrections for Airspeed and Flow Angle Measurements on Fixed-Wing Aircraft"
      author: "Jared A. Grauer"
      year: 2017
      report: "NASA/TM-2017-219795"
      nasa_document_id: "20180000023"
      table: "Table 1 - T-2 and GTM geometry and nominal mass properties"
    note: "The model-facing SI values live only under aircraft:. Flight-specific 2015 reference masses remain under simulation_reference_data and are not promoted to the active aircraft mass."


  engines:
    number_of_engines: 2
    engine_manufacturer: "JetCat"
    engine_model: "P70"
    engine_type: "turbine engine"
    engine_type_note: "NASA AirSTAR briefing terminology is 'Independent Turbine Engines (JetCat P70s, 16 lbs thrust)'. Do not classify the P70 hardware beyond terminology explicitly supported by the cited source."
    engine_variant: "NOT_FOUND_DO_NOT_ASSUME"
    fuel_type: "NOT_FOUND_DO_NOT_ASSUME"
    provenance:
      engine_identity: "NASA source"
      engine_type: "NASA source terminology"

  thrust_rating_per_engine:
    value_lbf: 16
    unit: "lbf"
    value_semantics: "RATED_HEADLINE_VALUE_NOT_CONSTANT_FLIGHT_THRUST"
    note: "NASA reports 16 lbf per engine as a rated/headline thrust value. No flight condition or test point is specified; do not treat this as constant thrust for the flight model."
    source:
      document: "AirSTAR: Simulation and Reduced-Scale Flight Test Facility"
      authors: "D. Cox, K. Cunningham (NASA Langley); G. Brian (DSTO)"
      year: 2010
      location: "Slide 11, 'TEST AIRCRAFT – GENERIC TRANSPORT MODEL (GTM) – T2' bullet: 'Independent Turbine Engines (JetCat P70s, 16 lbs thrust)'"
    second_source:
      document: "Flight Test Evaluation of Adaptive Control with AirSTAR: Techniques and Capabilities"
      authors: "A. Murch, K. Cunningham (NASA Langley)"
      year: 2009
      location: "Slide 6, 'TEST AIRCRAFT – GTM T2' bullet: 'JetCat P70s (16 lbs thrust each)'"
    provenance:
      thrust_rating: "NASA source"

  aircraft_weights_context_only:
    takeoff_weight_lb: 57
    landing_weight_lb: 48
    status: "CONTEXT_ONLY"
    note: "These values come from NASA GTM-T2 briefing slides and remain CONTEXT_ONLY. The 2015 flight-test paper reports nominal model/test masses of 1.639 slug for Flight 41 and 1.646 slug for Flight 15, so these weight figures must not be merged into those cases until exact configuration consistency is established."
    source:
      document: "Flight Test Evaluation of Adaptive Control with AirSTAR: Techniques and Capabilities"
      authors: "A. Murch, K. Cunningham (NASA Langley)"
      year: 2009
      location: "Slide 6, 'TEST AIRCRAFT – GENERIC TRANSPORT MODEL (GTM) – T2' bullets: 'Takeoff weight: 57 lbs', 'Landing weight: 48 lbs'"
    second_source:
      document: "AirSTAR: Simulation and Reduced-Scale Flight Test Facility"
      authors: "D. Cox, K. Cunningham (NASA Langley); G. Brian (DSTO)"
      year: 2010
      location: "Slide 11, same bullets for takeoff/landing weight"

  measured_channels:
    status: "NASA_VERIFIED"
    source_scope: "T-2 flight-test instrumentation described in AIAA 2015-2704"
    channels:
      - body_axis_translational_accelerations
      - angular_rates
      - estimated_euler_angles
      - differential_gps_position
      - differential_gps_velocity
      - angle_of_attack
      - sideslip
      - static_pressure
      - dynamic_pressure
      - fuel_flow_rate
      - control_surface_deflections
    source:
      document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
      authors: "Jared A. Grauer; Eugene A. Morelli"
      year: 2015
      aiaa_paper: "AIAA 2015-2704"
      nasa_document_id: "20160006007"

  engine_telemetry_available:
    rpm_measured: true
    pump_voltage_measured: true
    throttle_position_measured: true
    note: "Earlier NASA documents state that engine data (RPM, pump voltage, etc.) and throttle position were measured and recorded. Do not infer a native per-channel sample rate unless explicitly documented."
    source:
      document: "AirSTAR: Simulation and Reduced-Scale Flight Test Facility"
      authors: "D. Cox, K. Cunningham (NASA Langley); G. Brian (DSTO)"
      year: 2010
      location: "Slide 11, 'Instrumentation' bullet: 'Engine data (RPM, pump voltage, etc.), Air temp, Battery monitors.'"
    second_source:
      document: "Methodologies for Adaptive Flight Envelope Estimation and Protection"
      authors: "L. Tang et al. (Impact Technologies, NASA Langley)"
      year: 2009
      location: "Section VII (Simulation Results)"

  flight_data_collection:
    telemetry_rate_Hz: 200
    analysis_modeling_rate_Hz: 50
    processing: "data telemetered at 200 Hz and downsampled to 50 Hz for analysis and modeling"
    status: "NASA_VERIFIED"
    applies_to: "documented T-2 flight-test data stream in AIAA 2015-2704"
    does_not_imply: "every individual sensor or engine telemetry channel had a native digitization/sample rate of exactly 200 Hz or 50 Hz"
    note: "Use 50 Hz as the documented analysis/modeling stream rate. Keep native sensor/channel sampling distinct unless a source explicitly establishes it."
    source:
      document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
      authors: "Jared A. Grauer; Eugene A. Morelli"
      year: 2015
      aiaa_paper: "AIAA 2015-2704"
      nasa_document_id: "20160006007"

  signal_conditioning:
    anti_aliasing_filter:
      type: "first_order"
      cutoff_frequency_Hz: 16
      status: "NASA_VERIFIED"
      application: "applied before measurement digitization"
      source:
        document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
        authors: "Jared A. Grauer; Eugene A. Morelli"
        year: 2015
        aiaa_paper: "AIAA 2015-2704"
        nasa_document_id: "20160006007"

# -----------------------------------------------------------------------------
# DERIVED_DATA
# Quantities derived from NASA-supported values using exact arithmetic or unit
# conversion. These are not independent NASA measurements.
# -----------------------------------------------------------------------------
derived_data:

  thrust_total_headline:
    value_lbf: 32
    status: "DERIVED_FROM_NASA_RATED_HEADLINE_THRUST"
    calculation: "2 * nasa_verified_physical_data.thrust_rating_per_engine.value_lbf"
    note: "Derived total headline thrust only; not a directly verified standalone measurement and not a constant flight-model thrust value."

  thrust_headline_si:
    thrust_per_engine_N: 71.171545844168   # 16 lbf * 4.4482216152605
    thrust_total_N: 142.343091688336       # 32 lbf * 4.4482216152605
    status: "DERIVED_FROM_RATED_HEADLINE_THRUST"
    conversion_note: "1 lbf = 4.4482216152605 N (exact definition-based conversion)"

  aircraft_weights_si_context_only:
    takeoff_weight_N: 253.5486      # 57 lbf * 4.4482216152605
    landing_weight_N: 213.5146      # 48 lbf * 4.4482216152605
    status: "CONTEXT_ONLY"
    conversion_note: "1 lbf = 4.4482216152605 N"

  aircraft_mass_context_only:
    takeoff_mass_slug: 1.7707       # 57 lbf / 32.174 ft/s^2
    landing_mass_slug: 1.4925       # 48 lbf / 32.174 ft/s^2
    takeoff_mass_kg: 25.855         # 57 lbm * 0.45359237
    landing_mass_kg: 21.772         # 48 lbm * 0.45359237
    status: "CONTEXT_ONLY"
    g_ft_s2: 32.174
    g_m_s2: 9.80665
    mass_note: "Derived from context-only weight values; do not use automatically in the physics model until exact 2017 T-2 configuration consistency is established."

  thrust_to_weight_headline_context_only:
    tow_takeoff: 0.5614             # 32 / 57
    tow_landing: 0.6667             # 32 / 48
    status: "CONTEXT_ONLY"
    tow_note: "Based on derived headline total thrust and context-only weights; not a flight-condition-specific thrust-to-weight ratio."

# -----------------------------------------------------------------------------
# NASA_VERIFIED_MODEL_STRUCTURE
# NASA-documented model architectures and modeling methodology. Known model
# structure is separated from still-unpublished numerical engine equations and
# unidentified time constants.
# -----------------------------------------------------------------------------
nasa_verified_model_structure:

  propulsion_model_references:

    propulsion_system_identification_description:
      architecture: "engine_RPM -> engine_model -> thrust"
      description: "Measured engine speed in RPM was used as input to an engine model to compute thrust. The engine model was identified from ground-test data, with adjustments for ram drag identified from flight data."
      primary_input: "engine_speed_rpm"
      output: "thrust_force"
      ram_drag_treatment: "adjustments identified from flight data"
      status: "NASA_VERIFIED_MODEL_METHODOLOGY"
      source:
        document: "Methodologies for Adaptive Flight Envelope Estimation and Protection"
        authors: "L. Tang et al. (Impact Technologies, NASA Langley)"
        year: 2009
        location: "Section VII (Simulation Results)"

    gtm_nonlinear_simulation_description:
      architecture: "pilot_throttle -> first_order_engine_dynamics -> thrust"
      engine_description: "two turbojet engines"
      engine_description_scope: "terminology used for the GTM nonlinear simulation in the 2015 paper; do not automatically use this phrase as a hardware classification for the JetCat P70 beyond that source context"
      status: "NASA_VERIFIED_MODEL_STRUCTURE"
      source:
        document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
        authors: "Jared A. Grauer; Eugene A. Morelli"
        year: 2015
        aiaa_paper: "AIAA 2015-2704"
        nasa_document_id: "20160006007"

    interpretation_note: "These are separate NASA-documented modeling descriptions serving different purposes. Keep the RPM-based system-identification thrust model and the throttle-to-thrust first-order nonlinear-simulation engine dynamics as separate references; do not force them into one asserted NASA throttle -> RPM -> thrust architecture."

  engine_dynamics:
    structure: "first_order_lag_throttle_to_thrust"
    time_constant_sec: "NOT_FOUND_DO_NOT_ASSUME"
    source_status: "MODEL_STRUCTURE_VERIFIED_NASA"
    note: "NASA GTM simulation uses first-order lag dynamics from pilot throttle input to thrust. The numerical time constant is not supplied here and must not be assumed."
    source:
      document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
      authors: "Jared A. Grauer; Eugene A. Morelli"
      year: 2015
      aiaa_paper: "AIAA 2015-2704"
      nasa_document_id: "20160006007"

  throttle_usage:
    throttle_position_recorded: true
    throttle_used_in_control_architecture: true
    throttle_to_rpm_dynamics: "NOT_FOUND_DO_NOT_ASSUME"
    note_throttle_recorded: "NASA states throttle position was measured and recorded."
    note_verified_dynamics: "The 2015 GTM nonlinear simulation verifies a first-order throttle-to-thrust dynamic structure."
    note_unknown_dynamics: "This does not establish a T-2 throttle-to-RPM dynamic model or time constant; throttle-to-RPM dynamics remain unknown."
    source_throttle_recorded:
      document: "Methodologies for Adaptive Flight Envelope Estimation and Protection"
      authors: "L. Tang et al."
      year: 2009
      location: "Section VII (Simulation Results)"
    source_throttle_to_thrust_structure:
      document: "A New Formulation of the Filter-Error Method for Aerodynamic Parameter Estimation in Turbulence"
      authors: "Jared A. Grauer; Eugene A. Morelli"
      year: 2015
      aiaa_paper: "AIAA 2015-2704"
      nasa_document_id: "20160006007"

  numerical_engine_thrust_equation:
    public_equation_form: "NOT_FOUND_DO_NOT_ASSUME"
    dynamic_structure_known: true
    known_dynamic_structure: "first_order_lag_throttle_to_thrust"
    note: "The dynamic structure is documented, but the explicit numerical engine/thrust equation, coefficients, and time constant are not supplied here. Do not conflate a known model structure with a known numerical equation."

  ram_drag_modeling_statement:
    nasa_supported_statement: "adjustments for ram drag were identified from flight data"
    explicit_mathematical_form: "NOT_FOUND_DO_NOT_ASSUME"
    note: "NASA documents the identification treatment, not the project-defined function ram_drag = f(airspeed, engine_rpm)."

  asymmetry_and_engine_out:
    left_right_thrust_data: "NOT_FOUND_DO_NOT_ASSUME"
    engine_out_test_data: "NOT_FOUND_DO_NOT_ASSUME"
    asymmetry_note: "No T-2-specific left/right propulsion dataset or asymmetric-thrust/engine-out dataset is established in the cited sources used here."

  external_dataset_compatibility:
    cmapss_turbofan_datasets:
      applicable: false
      reason: "CMAPSS / turbofan degradation datasets are for large turbofan engines under different operating conditions and are not configuration-matched to JetCat P70 on AirSTAR T-2."
      recommendation: "Do not use CMAPSS data as a direct proxy for T-2 propulsion parameters."

