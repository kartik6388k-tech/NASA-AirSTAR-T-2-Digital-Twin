# -----------------------------------------------------------------------------
# PROJECT_DEFINED_PARAMETERS
# Project abstractions, candidate structures, fault definitions, and
# identification plans. Nothing in this section is to be attributed to NASA
# unless a specific NASA-supported statement is separately cited above.
# -----------------------------------------------------------------------------
project_defined_parameters:

  thrust_model_abstraction:
    model_form: "PROJECT_DEFINED_ABSTRACTION"
    narrative: "Project abstraction for thrust estimation. Keep NASA's RPM -> engine model -> thrust system-identification description separate from NASA's GTM nonlinear-simulation structure pilot throttle -> first-order engine dynamics -> thrust. Do not claim that throttle -> RPM -> thrust is the only NASA-verified architecture."
    nasa_reference_structures:
      rpm_based_thrust_estimation: "nasa_verified_model_structure.propulsion_model_references.propulsion_system_identification_description"
      throttle_to_thrust_dynamics: "nasa_verified_model_structure.propulsion_model_references.gtm_nonlinear_simulation_description"
    project_candidate_structure:
      primary_predictor: "engine_rpm"
      ram_drag_inputs: ["airspeed", "engine_rpm"]
      throttle_to_rpm_dynamics: "TO_BE_IDENTIFIED"
    equation_abstraction: "T = f(RPM, V, ...)"
    equation_status: "PROJECT_DEFINED_NOT_NASA_EQUATION"
    equation_note: "This functional notation is a project-defined abstraction only. NASA is not being cited as providing this equation or functional form."
    provenance:
      model_structure: "PROJECT_DEFINED"
      model_parameters: "TO_BE_IDENTIFIED"

  engine_static_thrust_identification:
    status: "TO_BE_IDENTIFIED"
    scope: "IDENTIFICATION_FROM_EXISTING_NASA_DATA_OR_SYSTEM_ID_ONLY"
    physical_ground_test_on_nasa_t2: false
    planned_inputs:
      rpm: "primary thrust predictor consistent with NASA-described methodology"
      airspeed: "candidate input for project-defined ram-drag correction structure"
      throttle_command: "recorded/control input that may support dynamic identification"
    planned_outputs: ["thrust_per_engine"]
    method:
      - "Use existing NASA ground-test-derived engine-model information if it becomes available."
      - "Use available NASA flight data and system-identification methods."
    note: "This project does not plan or imply new physical ground tests on the NASA T-2. Identification relies on existing NASA data/model information and flight-data system identification."

  engine_dynamic_lag:
    status: "STRUCTURE_VERIFIED_PARAMETER_TO_BE_IDENTIFIED"
    verified_structure: "first_order_lag_throttle_to_thrust"
    verified_structure_source: "nasa_verified_model_structure.engine_dynamics"
    throttle_to_rpm_dynamics: "NOT_FOUND_DO_NOT_ASSUME"
    time_constant_sec: "NOT_FOUND_DO_NOT_ASSUME"
    identification_method: "Use NASA data/model information and system-identification methods if sufficient to identify a numerical dynamic parameter; otherwise leave it unparameterized."
    note: "NASA verifies the first-order throttle-to-thrust structure for the GTM nonlinear simulation, but no generic time constant is inserted and no T-2 throttle-to-RPM dynamics are assumed."

  ram_drag_model:
    status: "PROJECT_DEFINED_PROPOSED_STRUCTURE"
    structure: "ram_drag = f(airspeed, engine_rpm)"
    structure_origin: "PROJECT_DEFINED_NOT_NASA_FORMULATION"
    nasa_supported_statement: "NASA states that adjustments for ram drag were identified from flight data."
    parameters: "NOT_FOUND_DO_NOT_ASSUME"
    note: "The functional structure above is a project proposal for identification; it is not a verified NASA mathematical formulation."

  health_monitoring_states:
    thrust_loss_factor_per_engine:
      symbol: "lambda_i"
      range: "[0, 1]"
      convention: "lambda_i = 0 -> healthy engine; lambda_i = 1 -> complete modeled thrust loss for engine i"
      thrust_relation: "T_actual_i = (1 - lambda_i) * T_expected_i"
      model_origin: "PROJECT_DEFINED_NOT_NASA_DERIVED"
      status: "TO_BE_ESTIMATED"
      note: "lambda_i and its thrust-loss relation are project-defined health-monitoring abstractions, not NASA-derived propulsion equations."

    engine_degradation:
      category: "PHYSICAL_ENGINE_HEALTH_CHANGE"
      description: "Slowly varying physical reduction in engine thrust capability at a comparable operating state."
      status: "TO_BE_ESTIMATED"

    sensor_bias:
      rpm_bias:
        category: "SENSOR_FAULT"
        description: "Additive bias on the RPM measurement; keep separate from physical engine degradation."
        status: "TO_BE_ESTIMATED"
      pump_voltage_bias:
        category: "SENSOR_FAULT"
        description: "Additive bias on the pump-voltage measurement; project-defined sensor fault, not an engine-degradation parameter."
        status: "TO_BE_ESTIMATED"

    note: "No specific T-2 degradation/fault parameterization is established by the located NASA sources. The health/fault model in this section is project-defined and separated from NASA-supported data."

  use_of_kaggle_cmapss_data:
    allowed_as_direct_substitute: false
    allowed_as_conceptual_reference: true
    note: "May be used for conceptual understanding of turbofan degradation modeling, but not as a source of numeric parameters for the T-2 JetCat P70 propulsion model."

  longitudinal_gust:
    provenance: "PROJECT_DEFINED_TURBULENCE"
    name: "Project-Defined Longitudinal 1-Cosine Gust"
    description: "Deterministic 1-cosine vertical gust input for longitudinal reduced-order short-period dynamics. PROJECT_DEFINED simulation input, not NASA aircraft data."
    enabled: false
    gust_amplitude_mps: 1.5
    gust_duration_s: 1.0
    start_time_s: 1.0
    note: "Default is enabled: false so standard baseline runs are completely unaffected. Activated explicitly for gust-response scenarios."

